<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>petalfall: from a script tag</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1322; }
  petalfall { height: 100%; }
</style>

<petal-fall palette="sakura" detail petals="6"></petal-fall>

<!-- No build step: this one file registers <petal-fall> and sets window.Petalfall.
     From a CDN it would be https://unpkg.com/petalfall -->
<script src="../lib/petalfall.iife.js"></script>
<script>
  console.log("Sakura API:", Object.keys(window.Petalfall).join(", "));
</script>
